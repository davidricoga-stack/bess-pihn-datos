name: Descargar PML NODO 04PIH-115 2025-2026

on:
  workflow_dispatch:

jobs:
  descargar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Descargar 7 dias por consulta (SW-PML)
        run: |
          python3 << 'EOF'
          import datetime
          import json
          import ssl
          import time
          import urllib.parse
          import urllib.request
          import csv
          from concurrent.futures import ThreadPoolExecutor
          
          WS = "https://ws01.cenace.gob.mx:8082/SWPML/SIM/{sis}/{proc}/{nodos}/{ai}/{mi}/{di}/{af}/{mf}/{df}/{fmt}"
          SISTEMA = "SIN"
          PROCESO = "MDA"
          NODO = "04PIH-115"
          ANIO_INI = 2025
          ANIO_FIN = 2026
          CTX = ssl.create_default_context()
          
          def fetch_nodo(nodo_id, fecha_ini, fecha_fin):
              try:
                  url = WS.format(
                      sis=SISTEMA,
                      proc=PROCESO,
                      nodos=nodo_id,
                      ai=fecha_ini.year,
                      mi=fecha_ini.month,
                      di=fecha_ini.day,
                      af=fecha_fin.year,
                      mf=fecha_fin.month,
                      df=fecha_fin.day,
                      fmt="JSON"
                  )
                  
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  raw = urllib.request.urlopen(req, timeout=45, context=CTX).read().decode("utf-8", "replace")
                  j = json.loads(raw)
                  
                  if j.get("status") != "OK" or not j.get("Resultados"):
                      return None
                  
                  registros = []
                  for nodo in j.get("Resultados", []):
                      clv_nodo = nodo.get("clv_nodo", "04PIH-115")
                      for valor in nodo.get("Valores", []):
                          try:
                              registros.append({
                                  "fecha": valor.get("fecha"),
                                  "hora": int(valor.get("hora", 0)),
                                  "pml": round(float(valor.get("pml", 0)), 2),
                                  "pml_ene": round(float(valor.get("pml_ene", 0)), 2),
                                  "pml_per": round(float(valor.get("pml_per", 0)), 2),
                                  "pml_cng": round(float(valor.get("pml_cng", 0)), 2)
                              })
                          except:
                              pass
                  
                  return registros if registros else None
              except:
                  return None
          
          fecha_ini = datetime.datetime(ANIO_INI, 1, 1)
          fecha_fin = datetime.datetime(ANIO_FIN, 12, 31)
          
          periodos = []
          fecha_actual = fecha_ini
          while fecha_actual <= fecha_fin:
              fecha_bloque_fin = min(fecha_actual + datetime.timedelta(days=6), fecha_fin)
              periodos.append((fecha_actual, fecha_bloque_fin))
              fecha_actual = fecha_bloque_fin + datetime.timedelta(days=1)
          
          print(f"Descargando NODO {NODO} en {len(periodos)} periodos de 7 dias")
          print("-" * 70)
          
          todos_registros = []
          exitos = 0
          
          for idx, (f_ini, f_fin) in enumerate(periodos, 1):
              resultado = fetch_nodo(NODO, f_ini, f_fin)
              
              if resultado:
                  todos_registros.extend(resultado)
                  exitos += 1
                  if idx % 10 == 0:
                      print(f"[{idx:3d}/{len(periodos)}] {f_ini.strftime('%Y-%m-%d')} a {f_fin.strftime('%Y-%m-%d')} OK - {len(resultado)} registros")
              else:
                  if idx % 10 == 0:
                      print(f"[{idx:3d}/{len(periodos)}] {f_ini.strftime('%Y-%m-%d')} a {f_fin.strftime('%Y-%m-%d')} Retry...")
              
              time.sleep(0.3)
          
          print(f"\n✓ EXITOSOS: {exitos}/{len(periodos)} periodos")
          print(f"✓ Total registros: {len(todos_registros)}")
          
          salida = "precios_pml_nodo_04PIH115_2025_2026.csv"
          with open(salida, 'w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=['fecha', 'hora', 'pml', 'pml_ene', 'pml_per', 'pml_cng'])
              writer.writeheader()
              for reg in todos_registros:
                  writer.writerow(reg)
          
          print(f"✓ Guardado: {salida}")
          
          EOF
      
      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datos-pml-nodo-04pih115
          path: precios_pml_nodo_04PIH115_2025_2026.csv
          retention-days: 30
